; PlatformIO Project Configuration File
[platformio]
; `pio run` builds firmware by default. The windows_x86 environment below is
; test-only and must be invoked explicitly with `pio test -e windows_x86`.
default_envs = seeed_xiao_esp32s3
; The ESP32-S3 GCC 8 toolchain cannot reliably resolve deeply nested library
; includes once a project-local .pio path crosses Windows MAX_PATH. Store both
; build outputs and lib_deps under PlatformIO's shorter per-user core directory.
; PROJECT_HASH keeps simultaneous checkouts isolated from one another.
workspace_dir = ${platformio.core_dir}/workspaces/${PROJECT_HASH}

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
; Auto-symbolize panic backtraces against this build's firmware.elf so a crash
; decodes in place (no manual addr2line, no ELF-mismatch guesswork).
monitor_filters = esp32_exception_decoder

; Custom partition table — 5 MB app + ~3 MB LittleFS. The LittleFS
; partition holds /rules/factory/*.json (read-only seeds shipped with the
; build) and /rules/user/*.json (writable, persisted via RulesService).
;
; First flash with this layout WIPES NVS once; subsequent boots are stable.
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

; Arduino's default is -Os; LVGL's software blend/blit loops are hot enough
; that speed-optimizing the whole build is a measurable FPS win. The 5 MB app
; partition absorbs the size growth.
build_unflags = -Os

build_flags =
    -O2
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; LVGL scroll glides run at 120 px/s clamped to [MIN, MAX] ms; defaults
    ; are 200/400 (#ifndef-guarded in lv_obj_scroll.c). Every animated frame
    ; is a full redraw, so shorter glides cost less. Hardware-tested feel:
    ; 150 too fast, 400 sluggish — 300 is the compromise. Applies globally.
    -DSCROLL_ANIM_TIME_MAX=300
    ; LovyanGFX ships an example lv_conf.h at:
    ;   .pio/libdeps/.../LovyanGFX/examples/Advanced/LVGL_PlatformIO/src/lv_conf.h
    ; PlatformIO's recursive scanning would find that one before ours when LVGL's
    ; library files do `#include "lv_conf.h"`. Using LV_CONF_PATH with an absolute
    ; path bypasses include-path search entirely.
    -DLV_CONF_PATH=\"$PROJECT_DIR/include/lv_conf.h\"
    ; Sysmon flags also passed as -D so the LVGL .a actually compiles
    ; lv_sysmon.c (otherwise lv_sysmon_show/hide_performance are missing).
    -DLV_USE_SYSMON=1
    -DLV_USE_PERF_MONITOR=1
    ; QR code widget used by the Tutorial screen (EEZ-generated).
    ; Both the lv_conf.h flag and this -D are required — see ARCHITECTURE.md
    ; LVGL caching footgun: header change alone may not rebuild the .a.
    -DLV_USE_QRCODE=1

extra_scripts =
    ; Scans src/ and include/ for `lv_font_montserrat_NN` references and
    ; appends `-DLV_FONT_MONTSERRAT_NN=1` for each. Combined with thereboot to restore
    ; #ifndef guards in lv_conf.h, this auto-enables any font size used
    ; by SLS-exported code without manual config edits.
    pre:scripts/auto_montserrat.py
    ; Writes include/build_info.h with today's build date and the EEZ
    ; project file's last-modified date (as the UI version).
    pre:scripts/build_info.py
    ; Reads scripts/vendors.py and emits include/vendor_tables_data.h —
    ; sorted lookup tables that RulesService uses to resolve `oui=axon`
    ; / `mfg=apple` style match clauses against scan results.
    pre:scripts/build_vendor_tables.py
    ; Bakes include/admin_secret.h (the admin-mode HMAC key + PBKDF2 password
    ; digest) from HELGATCHI_HMAC_SECRET / HELGATCHI_ADMIN_PASSWORD env vars.
    ; Hard-fails if unset unless ALLOW_DEV_ADMIN_SECRET=1. Output gitignored.
    pre:scripts/build_admin_secret.py

lib_deps =
    lovyan03/LovyanGFX
    fastled/FastLED
    lvgl/lvgl@^9.5
    bblanchon/ArduinoJson@^7.0
    h2zero/NimBLE-Arduino

[env:windows_x86]
platform = windows_x86@1.2.0
test_framework = unity
test_build_src = yes
test_filter = test_*
build_flags =
    -std=gnu++11
    -DLED_CATALOG_ONLY
build_src_filter =
    -<*>
    +<helga_animation.cpp>
    +<helga_menu_model.cpp>
    +<helga_playback_state.cpp>
    +<led_manual_state.cpp>
    +<led_menu_model.cpp>
    +<led_service.cpp>
    +<party_session_state.cpp>
    +<vibe_pattern.cpp>
    +<vibe_repeat_state.cpp>
    +<vibe_menu_model.cpp>
